id: T06
class: modify              # build|modify|batch
difficulty: D2
prompt: "把 pitzDailySteady 从稳态 SIMPLE 改成瞬态 PIMPLE。"
reference_tutorial: incompressibleFluid/pitzDailySteady   # 已用 R1 配方①核对存在
allowed_files: ["system/*"]
gates: [G1, G2, G3, G4, G5]      # README §6 四门 + 本框架 G5 范围门
g2b: diagnostic                  # 辅助信号，不进 status（README §6）
expect: pass                  # pass | refuse（T12 负对照必须 refuse）
expect_values:                  # 断言：actual 从产物读 / expect 来自需求 / tol 是谓词宽度
  - {"kind": "key_present", "scope": "file", "file": "system/fvSolution", "key": "PIMPLE", "expect_present": true}
  - {"kind": "key_present", "scope": "file", "file": "system/fvSolution", "key": "SIMPLE", "expect_present": false}
  - {"kind": "dict_value", "file": "system/fvSchemes", "dict": "ddtSchemes", "key": "default", "expect": "Euler"}
expect_values_note: |
  三条必须一起判：只改 PIMPLE 不改 ddtSchemes 是自相矛盾的瞬态设置，G3 不一定抓得住。
