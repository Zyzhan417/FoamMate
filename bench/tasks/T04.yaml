id: T04
class: build              # build|modify|batch
difficulty: D4
prompt: "基于 T3A，把湍流模型从 kOmegaSSTLM 换成 kOmegaSST。"
reference_tutorial: incompressibleFluid/T3A   # 已用 R1 配方①核对存在
allowed_files: ["system/*", "constant/momentumTransport", "0/*"]
gates: [G1, G2, G3, G4, G5]      # README §6 四门 + 本框架 G5 范围门
g2b: diagnostic                  # 辅助信号，不进 status（README §6）
expect: pass                  # pass | refuse（T12 负对照必须 refuse）
expect_values:                  # 断言：actual 从产物读 / expect 来自需求 / tol 是谓词宽度
  - {"kind": "dict_value", "file": "constant/momentumTransport", "dict": "RAS", "key": "model", "expect": "kOmegaSST"}
expect_values_note: |
  baseline model=kOmegaSSTLM。T3A 的 0/ 已含 omega，故不能用「omega 是否存在」当判据。
