id: T10
class: batch              # build|modify|batch
difficulty: D2
prompt: "顶盖速度和动力粘度两个参数各取 3 个值，共 9 例。"
reference_tutorial: incompressibleFluid/cavity   # 已用 R1 配方①核对存在
allowed_files: ["system/*", "0/U", "constant/physicalProperties"]
gates: [G1, G2, G3, G4, G5]      # README §6 四门 + 本框架 G5 范围门
g2b: diagnostic                  # 辅助信号，不进 status（README §6）
expect: pass                  # pass | refuse（T12 负对照必须 refuse）
expect_values:                  # 断言：actual 从产物读 / expect 来自需求 / tol 是谓词宽度
  - {"kind": "dict", "file": "constant/physicalProperties", "key": "nu", "expect": 2e-05, "tol": 1e-12}
expect_values_note: |
  nu 输出带量纲（1e-05 [ m^2 / s]），解析前必须剥掉方括号块。9 例逐个施加。
